apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-connect-server
  namespace: kubeflow-user-example-com
  labels:
    app: spark-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-connect
  template:
    metadata:
      labels:
        app: spark-connect
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: default-editor
      containers:
        - name: spark-connect
          image: apache/spark:4.0.1-python3
          command:
            - /bin/bash
            - -c
            - |
              /opt/spark/sbin/start-connect-server.sh \
                --conf spark.connect.grpc.binding.port=15002 \
                --conf spark.driver.host=$(POD_IP) \
                --conf spark.driver.bindAddress=0.0.0.0 \
                --conf spark.master=k8s://https://kubernetes.default.svc \
                --conf spark.kubernetes.container.image=apache/spark:4.0.1-python3 \
                --conf spark.kubernetes.namespace=kubeflow-user-example-com \
                --conf spark.kubernetes.authenticate.driver.serviceAccountName=default-editor \
                --conf spark.kubernetes.executor.deleteOnTermination=true \
                --conf spark.kubernetes.executor.label.sidecar.istio.io/inject=false \
                --conf spark.dynamicAllocation.enabled=true \
                --conf spark.dynamicAllocation.shuffleTracking.enabled=true \
                --conf spark.dynamicAllocation.shuffleTracking.timeout=60s \
                --conf spark.dynamicAllocation.minExecutors=0 \
                --conf spark.dynamicAllocation.maxExecutors=4 \
                --conf spark.dynamicAllocation.executorIdleTimeout=30s \
                --conf spark.dynamicAllocation.schedulerBacklogTimeout=5s \
                --conf spark.executor.cores=1 \
                --conf spark.executor.memory=1g && \
              tail -f /opt/spark/logs/*
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 15002
              name: grpc
            - containerPort: 4040
              name: ui
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
---
apiVersion: v1
kind: Service
metadata:
  name: spark-connect
  namespace: kubeflow-user-example-com
spec:
  selector:
    app: spark-connect
  ports:
    - name: grpc
      port: 15002
      targetPort: 15002
      protocol: TCP
  type: ClusterIP
